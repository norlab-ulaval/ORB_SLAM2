%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

# Camera calibration and distortion parameters (OpenCV) 
Camera.fx: 1186.3604467350422
Camera.fy: 1186.0069819358844
Camera.cx: 961.6762371609761
Camera.cy: 583.031037539774

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

Camera.width: 1920
Camera.height: 1200

# Camera frames per second 
# Camera.fps: 3.666667
Camera.fps: 22.0

# stereo baseline times fx
Camera.bf: 207.17403997349834

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
ThDepth: 35

